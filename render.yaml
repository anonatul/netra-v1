databases:
  - name: netra-db
    plan: free
    region: singapore

services:
  - type: web
    name: netra-backend
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    releaseCommand: python -m scripts.init_db
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: netra-db
          property: connectionString
      - key: LLM_ENABLED
        value: "true"
      - key: AI_GATEWAY_BASE_URL
        value: "https://ai.tcetcercd.in/v1"
      - key: AI_GATEWAY_MODEL
        value: "/home/user1/models/Qwen3.6-35B-A3B-NVFP4-Fast"
      - key: JWT_SECRET
        generateValue: true
